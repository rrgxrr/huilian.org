# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
services:
  - type: web
    name: huilian
    runtime: python
    plan: starter            # paid plan: required for the persistent disk
    region: singapore
    numInstances: 1          # SQLite on a disk: one instance only
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app huilian bootstrap && gunicorn -w 2 --threads 4 -b 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    disk:
      name: huilian-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE
        value: /var/data/huilian.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      # filled in by you when you create the Blueprint
      - key: BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
