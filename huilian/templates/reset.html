{% extends 'base.html' %}
{% set nav = 'profile' %}
{% block wrap_class %}narrow{% endblock %}
{% block content %}
<h1>{{ t('forgot_title') }}</h1>
<form class="stack" method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="f">{{ t('new_password') }}<input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <button class="btn gold block" type="submit">{{ t('save') }}</button>
</form>
{% endblock %}
